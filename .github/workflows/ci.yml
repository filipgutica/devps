name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    name: Check (macOS)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Install fzf for picker keyboard tests
        run: brew install fzf
      - run: npm run typecheck
      - run: npm test
      - name: Verify CLI version
        run: test "$(./dist/cli.js --version)" = "$(node -p "require('./package.json').version")"
      # Hosted macOS runners hide sockets from unprivileged lsof, so the smoke test runs as root there.
      - run: sudo --preserve-env=PATH test/smoke.sh
